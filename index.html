<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ตารางคงเหลือรับ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: หน้าเดียว ผลลัพธ์อยู่บนสุด ตามด้วยตารางบวกลบ และตารางเงินกู้ (จอกว้างวางข้างกัน) */
:root {
  --bg: #F4F6F5;
  --surface: #FFFFFF;
  --hero: #E9F3F0;
  --ink: #17221F;
  --muted: #667873;
  --line: #E1E7E4;
  --field: #EEF2F0;
  --accent: #0E6B5C;
  --ring: rgba(14, 107, 92, .22);
  --good: #1B7A4B;
  --good-bg: #DDF1E5;
  --bad: #B2352A;
  --bad-bg: #F9E1DE;
  --warn: #8A5A00;
  --warn-bg: #FAEBC9;
  --font: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #172120; --hero: #14302B; --ink: #E6EFEC; --muted: #8FA39D;
    --line: #26332F; --field: #1F2C29; --accent: #4CC3AB; --ring: rgba(76, 195, 171, .28);
    --good: #6FD39A; --good-bg: #17382A; --bad: #FF8F82; --bad-bg: #402220; --warn: #F2C260; --warn-bg: #3A2F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #172120; --hero: #14302B; --ink: #E6EFEC; --muted: #8FA39D;
  --line: #26332F; --field: #1F2C29; --accent: #4CC3AB; --ring: rgba(76, 195, 171, .28);
  --good: #6FD39A; --good-bg: #17382A; --bad: #FF8F82; --bad-bg: #402220; --warn: #F2C260; --warn-bg: #3A2F14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4;
  padding-inline: 16px; padding-block: 14px;
}
.wrap { max-width: 440px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
.actions { display: flex; align-items: center; gap: 6px; }

/* ปุ่มอีโมจิ */
.ib {
  font: inherit; font-size: 16px; line-height: 1; width: 32px; height: 30px; padding: 0; cursor: pointer;
  color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px;
}
.ib:hover { background: var(--field); }
.ib.warn { border-color: var(--bad); background: var(--bad-bg); }
.ib.lg { width: 44px; height: 40px; font-size: 20px; }
.ib:focus-visible, .sw:focus-visible, .x:focus-visible, .add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* สวิตช์โหมดมืด/สว่าง */
.sw {
  position: relative; width: 60px; height: 30px; padding: 0 7px; cursor: pointer; font-size: 13px; line-height: 1;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--field); border: 1px solid var(--line); border-radius: 99px; color: var(--ink);
}
.sw .tr { opacity: .55; pointer-events: none; }
.knob {
  position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .28);
  display: grid; place-items: center; font-style: normal; font-size: 14px; transition: transform .2s;
}
.sw[aria-checked="true"] .knob { transform: translateX(30px); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 6px; }
.cap { font-size: 11px; letter-spacing: .04em; color: var(--muted); padding-top: 8px; }

/* hero */
.hero { background: var(--hero); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.head .l { font-size: 13px; color: var(--muted); }
.ps { display: grid; justify-items: end; gap: 3px; text-align: right; }
.sub { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; color: var(--muted); }
.sub.ok { color: var(--good); } .sub.no { color: var(--bad); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: var(--field); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); }
.pill.no { background: var(--bad-bg); color: var(--bad); }
.big { font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.big.neg { color: var(--bad); }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface); margin-block: 4px 6px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); width: 0; transition: width .2s; }
.bar.no i { background: var(--bad); }
.bar b { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--ink); border-radius: 1px; }
.crit { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); }
.crit b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
/* คำแนะนำยอดผ่อน */
.adv { border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.adv.ok { background: var(--good-bg); }
.adv.no { background: var(--bad-bg); }
.adv.ok, .adv.no { color: var(--ink); font-variant-numeric: tabular-nums; }
.adv b { font-weight: 600; }
.critbox { display: grid; gap: 6px; }
.used { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
input.used, .gh.used { text-decoration: none; border-bottom: 2px solid var(--accent); }
.adv[hidden] { display: none; }
.crit .mut { font-size: 12px; }

/* ledger rows */
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 36px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.sg { color: var(--muted); font-weight: 500; text-align: center; }
.row.sum .sg { color: var(--accent); }
.row.sum label, .row.sum .val { font-weight: 600; }
.val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; padding-right: 11px; }
.val.strong { color: var(--accent); font-size: 16px; font-weight: 600; }
label { color: var(--ink); }
label small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.crit label { color: var(--muted); }

/* ช่องกรอก (.gh คือสำเนาแบบไม่ใช่ input ที่ใช้ตอนส่งออกรูป) */
input, .gh {
  font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent;
  border-radius: 8px; height: 30px; line-height: 28px; padding: 0 10px; min-width: 0; font-variant-numeric: tabular-nums;
}
.gh { overflow: hidden; white-space: nowrap; }
.num { width: 120px; text-align: right; }
.hero .num { width: 100px; background: var(--surface); }
.hero .num.sm { width: 74px; }
.pct { width: 40px; height: 24px; line-height: 22px; text-align: center; padding: 0 2px; border-radius: 6px; background: var(--surface); }
input::placeholder { color: var(--muted); opacity: .6; }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

/* debts */
.debts { border-bottom: 1px solid var(--line); padding-bottom: 8px; display: grid; gap: 4px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 84px 88px 24px; gap: 6px; align-items: center; }
.dh { font-size: 11px; color: var(--muted); padding-top: 4px; }
.dh span:nth-child(2), .dh span:nth-child(3) { text-align: right; padding-right: 10px; }
.dgrid input, .dgrid .gh { width: 100%; padding: 0 8px; }
.dgrid .num { text-align: right; }
.x, .add {
  border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 24px; height: 24px;
  border-radius: 6px; font: inherit; font-size: 16px; line-height: 1; padding: 0;
}
.x:hover { color: var(--bad); background: var(--bad-bg); }
.add { color: var(--accent); font-weight: 600; }
.add:hover { background: var(--field); }
.add[disabled] { opacity: .3; cursor: default; }

/* หน้าต่างรูปที่ส่งออก */
.ov { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .6); display: grid; place-items: center; padding: 16px; }
.ovc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; justify-items: center; max-width: 100%; max-height: 100%; }
.ovc img { display: block; max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain; border-radius: 6px; }
.ovb { display: flex; gap: 8px; }
.ov[hidden] { display: none; }
.hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }

@media (min-width: 780px) {
  .wrap { max-width: 880px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  header, .hero { grid-column: 1 / -1; }
  .hero { grid-template-columns: 1fr 1fr; column-gap: 28px; align-items: center; }
  .hero > .head { grid-column: 1; grid-row: 1 / 3; }
  .hero > .bar { grid-column: 2; grid-row: 1; }
  .hero > .critbox { grid-column: 2; grid-row: 2; }
  .hero > .adv { grid-column: 1 / -1; grid-row: 3; }
}
@media (prefers-reduced-motion: reduce) { .bar i, .knob { transition: none; } }
</style>

</head>
<body>
<main class="wrap" id="cap">
  <header>
    <h1>คงเหลือรับหลังกู้</h1>
    <div class="actions" data-html2canvas-ignore="true">
      <button class="sw" id="theme" type="button" role="switch" aria-checked="false" aria-label="สลับโหมดมืด/สว่าง" title="สลับโหมดมืด/สว่าง"><span class="tr">☀️</span><span class="tr">🌙</span><i class="knob" id="knob">☀️</i></button>
      <button class="ib" id="shot" type="button" aria-label="ส่งออกเป็นรูป" title="ส่งออกเป็นรูป">📷</button>
      <button class="ib" id="copy" type="button" aria-label="คัดลอกสรุปเป็นข้อความ" title="คัดลอกสรุปเป็นข้อความ">📋</button>
      <button class="ib" id="reset" type="button" aria-label="ล้างค่าทั้งหมด" title="ล้างค่าทั้งหมด (กดสองครั้ง)">🧹</button>
    </div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="head">
      <div><span class="l">เหลือรับต่อเดือน หลังกู้</span><div class="big" id="after">0<small>บาท</small></div></div>
      <div class="ps"><span class="pill" id="pill">—</span><span class="sub" id="psub"></span></div>
    </div>
    <div class="bar" id="bar"><i id="fill"></i><b id="tick"></b></div>
    <div class="critbox">
      <div class="crit" title="เงินเดือนใช้คิดเกณฑ์ขั้นต่ำเท่านั้น">
        <label for="sal">เงินเดือน</label>
        <input class="num" id="sal" inputmode="decimal" autocomplete="off" placeholder="0">
        <span>×</span>
        <input class="pct" id="pct" inputmode="decimal" autocomplete="off" aria-label="เปอร์เซ็นต์เกณฑ์ขั้นต่ำ">
        <span>% =</span>
        <b id="floor">0</b>
      </div>
      <div class="crit" title="ระเบียบ: เหลือรับไม่ต่ำกว่า 30% ของเงินเดือน และไม่น้อยกว่าจำนวนขั้นต่ำ">
        <label for="minAmt">ขั้นต่ำตามระเบียบ</label>
        <input class="num sm" id="minAmt" inputmode="decimal" autocomplete="off" placeholder="0">
        <span>บาท</span>
      </div>
    </div>
    <div class="adv" id="adv">กรอกเงินเดือนเพื่อดูเกณฑ์</div>
  </section>

  <section class="card" aria-label="ตารางบวกลบรายเดือน">
    <div class="row"><span class="sg"></span><label for="gross">รวมรับ <small>ตามสลิป</small></label><input class="num" id="gross" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    <div class="row"><span class="sg">−</span><label for="ded">รวมหักตามสลิป</label><input class="num" id="ded" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    <div class="row sum"><span class="sg">=</span><label>คงเหลือตามสลิป</label><span class="val" id="net">0</span></div>
    <div class="debts">
      <div class="row" style="border-bottom:0"><span class="sg">+</span><label>หนี้เดิมที่ปิด <small>คืนยอดผ่อน</small></label><span class="val" id="addback">0</span></div>
      <div class="dgrid dh"><span>รายการ</span><span>ผ่อน/เดือน</span><span>ยอดปิด</span><button class="add" id="add" type="button" aria-label="เพิ่มหนี้เดิม">+</button></div>
      <div id="debts" style="display:grid;gap:4px"></div>
    </div>
    <div class="row"><span class="sg">−</span><label for="nw">ผ่อนงวดใหม่ <small>ต่อเดือน</small></label><input class="num" id="nw" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  </section>

  <section class="card" aria-label="ตารางเงินกู้">
    <div class="row"><span class="sg"></span><label for="loan">ยอดกู้</label><input class="num" id="loan" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    <div class="row"><span class="sg">−</span><label>ปิดหนี้เดิม <small>รวมยอดปิด</small></label><span class="val" id="payoff">0</span></div>
    <div class="row"><span class="sg">−</span><label for="fee">ค่าธรรมเนียม / หักอื่นๆ</label><input class="num" id="fee" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    <div class="row sum"><span class="sg">=</span><label>รับเงินจริง</label><span class="val strong" id="cash">0</span></div>
  </section>
</main>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="รูปสรุป">
  <div class="ovc">
    <img id="shotimg" alt="รูปสรุปคงเหลือรับ">
    <div class="ovb">
      <button class="ib lg" id="dl" type="button" aria-label="บันทึกรูป" title="บันทึกรูป">💾</button>
      <button class="ib lg" id="cpimg" type="button" aria-label="คัดลอกรูป" title="คัดลอกรูป">📋</button>
      <button class="ib lg" id="close" type="button" aria-label="ปิด" title="ปิด">✖️</button>
    </div>
    <p class="hint">ถ้าบันทึกไม่ได้ กดค้างที่รูปเพื่อบันทึก</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var KEY = 'khlua-rab-v1', TKEY = 'ebb-theme';
  var $ = function (id) { return document.getElementById(id); };
  var NUM = ['sal', 'gross', 'ded', 'nw', 'loan', 'fee', 'pct', 'minAmt'];
  var BLANK = {
    sal: 0, gross: 0, ded: 0, nw: 0, loan: 0, fee: 0, pct: 30, minAmt: 5000,
    debts: [{ n: '', m: 0, b: 0 }]
  };
  var S = JSON.parse(JSON.stringify(BLANK));
  var root = document.documentElement;

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var p = JSON.parse(saved);
      if (p && p.debts) { if (p.gross === undefined) p.gross = p.sal || 0; if (p.minAmt === undefined) p.minAmt = 5000; S = p; }
    }
  } catch (e) {}

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function parse(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function fmt(n) { return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function fmtSigned(n) { return (n > 0 ? '+' : '') + fmt(n); }
  function show(el, n) { el.value = n ? fmt(n).replace('−', '-') : ''; }
  function flash(id, icon, ms) {
    var b = $(id), old = b.dataset.icon || b.textContent;
    b.dataset.icon = old; b.textContent = icon;
    setTimeout(function () { b.textContent = old; }, ms || 1500);
  }

  /* ---------- โหมดมืด/สว่าง ---------- */
  var sw = $('theme');
  function effective() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncSwitch() {
    var dark = effective() === 'dark';
    sw.setAttribute('aria-checked', dark ? 'true' : 'false');
    $('knob').textContent = dark ? '🌙' : '☀️';
  }
  try { var st = localStorage.getItem(TKEY); if (st === 'dark' || st === 'light') root.setAttribute('data-theme', st); } catch (e) {}
  sw.addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(TKEY, next); } catch (e) {}
    syncSwitch();
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncSwitch); } catch (e) {}
  syncSwitch();

  /* ---------- ตารางหนี้เดิม ---------- */
  var debtsEl = $('debts');
  function renderDebts() {
    debtsEl.innerHTML = '';
    S.debts.forEach(function (d, i) {
      var r = document.createElement('div');
      r.className = 'dgrid';
      r.innerHTML =
        '<input type="text" data-i="' + i + '" data-k="n" placeholder="ชื่อหนี้" autocomplete="off" aria-label="ชื่อหนี้">' +
        '<input class="num" data-i="' + i + '" data-k="m" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="ผ่อนต่อเดือน">' +
        '<input class="num" data-i="' + i + '" data-k="b" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="ยอดปิด">' +
        '<button class="x" type="button" data-rm="' + i + '" aria-label="ลบรายการ">×</button>';
      var ins = r.querySelectorAll('input');
      ins[0].value = d.n || '';
      show(ins[1], d.m); show(ins[2], d.b);
      debtsEl.appendChild(r);
    });
    $('add').disabled = S.debts.length >= 6;
  }

  /* ---------- คำนวณ ---------- */
  function calc() {
    var sal = S.sal || 0, gross = S.gross || 0, ded = S.ded || 0, nw = S.nw || 0, pct = S.pct || 0;
    var minAmt = S.minAmt || 0;
    var add = 0, payoff = 0;
    S.debts.forEach(function (d) { add += d.m || 0; payoff += d.b || 0; });
    var floorPct = sal * pct / 100;       // เงินเดือน ใช้คิดเกณฑ์เท่านั้น
    var floor = Math.max(floorPct, minAmt); // เหลือรับต้องไม่ต่ำกว่า 30% และไม่น้อยกว่าขั้นต่ำ
    var net = gross - ded;                // รวมรับ ใช้คิดหนี้สิน
    var after = net + add - nw;
    var margin = after - floor;           // + เกินเกณฑ์, − ขาด
    var maxNew = net + add - floor;       // ผ่อนใหม่สูงสุดที่ยังผ่านเกณฑ์
    var remp = sal > 0 ? after / sal * 100 : 0;
    var cash = (S.loan || 0) - payoff - (S.fee || 0);
    return { sal: sal, gross: gross, ded: ded, nw: nw, pct: pct, minAmt: minAmt, add: add, payoff: payoff, floorPct: floorPct, floor: floor, net: net, after: after, margin: margin, maxNew: maxNew, remp: remp, cash: cash };
  }

  var C;
  function state(c) {
    if (c.sal <= 0) return 'idle';
    return c.margin < 0 ? 'no' : 'ok';
  }
  // sub = ข้อความใต้ป้ายสถานะ, box = กล่องแนะนำยอดผ่อน (HTML)
  function advice(c) {
    var st = state(c);
    if (st === 'idle') return { st: st, sub: '', box: 'กรอกเงินเดือนเพื่อดูเกณฑ์' };
    var sub = fmtSigned(c.margin);   // ส่วนต่างจากเกณฑ์ เฉพาะตัวเลข: − ขาด, + เกิน
    var box = c.maxNew >= 0 ? 'ผ่อนไม่เกิน <b>' + fmt(c.maxNew) + '</b> จึงผ่าน' : '';
    return { st: st, sub: sub, box: box };
  }

  var C;
  function paint() {
    C = calc();
    $('net').textContent = fmt(C.net);
    $('addback').textContent = fmt(C.add);
    $('payoff').textContent = fmt(C.payoff);
    $('cash').textContent = fmt(C.cash);
    $('floor').textContent = fmt(C.floorPct);
    var big = $('after');
    big.innerHTML = fmt(C.after) + '<small>บาท</small>';
    big.className = 'big' + (C.after < 0 ? ' neg' : '');
    var adv = advice(C), pill = $('pill'), bar = $('bar');
    var labels = { idle: 'กรอกเงินเดือน', ok: 'ผ่านเกณฑ์', no: 'ต่ำกว่าเกณฑ์' };
    pill.textContent = labels[adv.st]; pill.className = 'pill' + (adv.st === 'idle' ? '' : ' ' + adv.st);
    bar.className = 'bar' + (adv.st === 'idle' ? '' : ' ' + adv.st);
    $('adv').className = 'adv' + (adv.st === 'idle' ? '' : ' ' + adv.st);
    var ps = $('psub'); ps.textContent = adv.sub; ps.className = 'sub' + (adv.st === 'idle' ? '' : ' ' + adv.st);
    $('adv').innerHTML = adv.box; $('adv').hidden = !adv.box;
    // เส้นใต้ = เกณฑ์ที่ใช้อยู่ (30% ของเงินเดือน หรือขั้นต่ำตามระเบียบ ค่าที่มากกว่า)
    var pctUsed = adv.st !== 'idle' && C.floorPct >= C.minAmt, minUsed = adv.st !== 'idle' && C.floorPct < C.minAmt;
    $('floor').classList.toggle('used', pctUsed); $('minAmt').classList.toggle('used', minUsed);
    // เส้นกลางแถบ = เกณฑ์ ถ้าเหลือรับยาวเกินเส้นกลางคือผ่าน
    var w = adv.st !== 'idle' && C.floor > 0 ? Math.min(Math.max(C.after, 0) / (2 * C.floor), 1) * 100 : 0;
    $('fill').style.width = w + '%';
    $('tick').style.left = 'calc(50% - 1px)';
  }

  function load() {
    NUM.forEach(function (k) { show($(k), S[k]); });
    renderDebts();
    paint();
  }

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT') return;
    if (t.id && NUM.indexOf(t.id) > -1) { S[t.id] = parse(t.value); }
    else if (t.dataset && t.dataset.i !== undefined) {
      var d = S.debts[+t.dataset.i], k = t.dataset.k;
      d[k] = k === 'n' ? t.value : parse(t.value);
    } else return;
    paint(); save();
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t.tagName === 'INPUT' && (t.classList.contains('num') || t.id === 'pct')) t.select();
  });
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT' || !(t.classList.contains('num') || t.id === 'pct')) return;
    var n = parse(t.value);
    t.value = n ? fmt(n).replace('−', '-') : '';
  });
  document.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) {
      S.debts.splice(+rm.dataset.rm, 1);
      if (!S.debts.length) S.debts.push({ n: '', m: 0, b: 0 });
      renderDebts(); paint(); save();
    }
  });
  $('add').addEventListener('click', function () {
    if (S.debts.length >= 6) return;
    S.debts.push({ n: '', m: 0, b: 0 });
    renderDebts(); paint(); save();
    var all = debtsEl.querySelectorAll('input[data-k="n"]');
    if (all.length) all[all.length - 1].focus();
  });

  /* ---------- ล้างค่า (กดสองครั้ง) ---------- */
  var rt;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!b.dataset.armed) {
      b.dataset.armed = '1'; b.textContent = '⚠️'; b.classList.add('warn');
      rt = setTimeout(function () { delete b.dataset.armed; b.textContent = '🧹'; b.classList.remove('warn'); }, 2500);
      return;
    }
    clearTimeout(rt); delete b.dataset.armed; b.textContent = '🧹'; b.classList.remove('warn');
    S = JSON.parse(JSON.stringify(BLANK));
    load(); save();
  });

  /* ---------- คัดลอกสรุปเป็นข้อความ ---------- */
  function summary() {
    var c = C, L = [];
    L.push('รวมรับ ' + fmt(c.gross));
    L.push('− รวมหักตามสลิป ' + fmt(c.ded) + ' → คงเหลือตามสลิป ' + fmt(c.net));
    S.debts.forEach(function (d) { if (d.m || d.b) L.push('+ ปิด ' + (d.n || 'หนี้เดิม') + ' ผ่อน ' + fmt(d.m || 0) + ' (ยอดปิด ' + fmt(d.b || 0) + ')'); });
    L.push('− ผ่อนงวดใหม่ ' + fmt(c.nw));
    L.push('= เหลือรับต่อเดือน ' + fmt(c.after));
    var st = state(c);
    L.push('เกณฑ์เหลือรับขั้นต่ำ = มากกว่าระหว่าง ' + c.pct + '% ของเงินเดือน ' + fmt(c.sal) + ' (' + fmt(c.floorPct) + ') กับขั้นต่ำ ' + fmt(c.minAmt) + ' = ' + fmt(c.floor));
    if (st === 'idle') L.push('ยังไม่ได้กรอกเงินเดือน');
    else {
      var ad = advice(c);
      L.push((st === 'no' ? 'ต่ำกว่าเกณฑ์ ขาด ' + fmt(-c.margin) : 'ผ่านเกณฑ์ เกิน ' + fmt(c.margin)) + ' บาท');
      if (c.maxNew >= 0) L.push('ผ่อนงวดใหม่ไม่เกิน ' + fmt(c.maxNew) + ' จึงผ่านเกณฑ์');
    }
    L.push('');
    L.push('ยอดกู้ ' + fmt(S.loan || 0) + ' − ปิดหนี้เดิม ' + fmt(c.payoff) + ' − ค่าธรรมเนียม ' + fmt(S.fee || 0) + ' = รับเงินจริง ' + fmt(c.cash));
    return L.join('\n');
  }
  $('copy').addEventListener('click', function () {
    var text = summary();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash('copy', ok ? '✅' : '⚠️');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('copy', '✅'); }, fallback);
    } else fallback();
  });

  /* ---------- ส่งออกเป็นรูป ---------- */
  // ทำสำเนาหน้าแบบจอแคบ ตัดแถวหนี้ที่ว่างและปุ่มแก้ไขออก เหลือแต่เนื้อหาพอดี
  function prepClone(doc, bg) {
    var oi = document.querySelectorAll('input'), ci = doc.querySelectorAll('input');
    ci.forEach(function (c, k) {
      var o = oi[k], g = doc.createElement('div');
      var isNum = o.classList.contains('num') || o.id === 'pct';
      g.className = 'gh ' + o.className;
      g.textContent = o.value || (isNum ? '0' : '');
      g.dataset.i = o.dataset.i || '';
      c.parentNode.replaceChild(g, c);
    });
    doc.querySelectorAll('#debts .dgrid').forEach(function (r) {
      var g = r.querySelector('.gh'), d = S.debts[+g.dataset.i];
      if (d && !d.n && !d.m && !d.b) r.remove();
    });
    if (!doc.querySelector('#debts .dgrid')) { var dh = doc.querySelector('.dh'); if (dh) dh.remove(); }
    doc.querySelectorAll('.x, .add').forEach(function (n) { n.remove(); });
    doc.querySelectorAll('.dgrid').forEach(function (g) { g.style.gridTemplateColumns = 'minmax(0,1fr) 84px 88px'; });
    var w = doc.getElementById('cap');
    w.style.padding = '16px'; w.style.maxWidth = '472px'; w.style.margin = '0'; w.style.background = bg;
  }

  var shotUrl = null, shotBlob = null;
  function closeShot() {
    $('ov').hidden = true;
    if (shotUrl) { URL.revokeObjectURL(shotUrl); shotUrl = null; }
    shotBlob = null;
  }
  $('shot').addEventListener('click', function () {
    if (typeof html2canvas === 'undefined') { flash('shot', '⚠️', 2000); return; }
    var b = $('shot'); b.dataset.icon = b.dataset.icon || b.textContent; b.textContent = '⏳'; b.disabled = true;
    var bg = getComputedStyle(document.body).backgroundColor;
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ready.then(function () {
      return html2canvas($('cap'), {
        backgroundColor: bg, scale: Math.max(2, window.devicePixelRatio || 1), windowWidth: 480,
        useCORS: true, logging: false, onclone: function (doc) { prepClone(doc, bg); }
      });
    }).then(function (canvas) {
      canvas.toBlob(function (blob) {
        b.textContent = b.dataset.icon; b.disabled = false;
        if (!blob) { flash('shot', '⚠️', 2000); return; }
        shotBlob = blob; shotUrl = URL.createObjectURL(blob);
        $('shotimg').src = shotUrl; $('ov').hidden = false;
      }, 'image/png');
    }).catch(function () {
      b.disabled = false; b.textContent = '⚠️';
      setTimeout(function () { b.textContent = b.dataset.icon; }, 2000);
    });
  });
  $('close').addEventListener('click', closeShot);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeShot(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ov').hidden) closeShot(); });
  $('dl').addEventListener('click', function () {
    if (!shotBlob) return;
    var d = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var name = 'ebb-tally-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.png';
    function plain() {
      var a = document.createElement('a');
      a.href = shotUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      flash('dl', '✅');
    }
    // ใน Artifact ใช้ความสามารถ downloads ของผู้ชม ส่วนบน GitHub Pages ดาวน์โหลดตรงๆ
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { plain(); return; }
        dl.save({ filename: name, data: shotBlob }).then(
          function () { flash('dl', '✅'); },
          function (err) { if (!err || err.code !== 'declined') flash('dl', '⚠️'); });
      }, plain);
    } else plain();
  });
  $('cpimg').addEventListener('click', function () {
    if (!shotBlob || !navigator.clipboard || !window.ClipboardItem) { flash('cpimg', '⚠️'); return; }
    navigator.clipboard.write([new ClipboardItem({ 'image/png': shotBlob })]).then(
      function () { flash('cpimg', '✅'); }, function () { flash('cpimg', '⚠️'); });
  });

  load();
})();
</script>

</body>
